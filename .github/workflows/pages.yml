# Test de code en zet de webapp online via GitHub Pages bij elke push naar main.
name: Testen en publiceren

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eén wachtrij per branch/PR: een push naar een PR mag de publicatie van main niet afbreken.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @scanapp/web
        env:
          # Cloud (Supabase): publieke gegevens, als repository-variabelen (geen geheimen). Leeg = cloud nog niet ingesteld.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: packages/web/dist

  browsertests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Chromium voor Playwright
        run: npx playwright install --with-deps chromium
      - name: Browsertests (pc en gsm)
        run: npm run e2e
      - name: Testrapport bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapport
          path: |
            packages/web/playwright-report
            packages/web/test-results
          retention-days: 14

  publiceren:
    if: github.ref == 'refs/heads/main'
    needs: [bouwen, browsertests]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
